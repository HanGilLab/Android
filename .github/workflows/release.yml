name: Release APK

on:
  push:
    tags: ['v*', '!v*-preview*']
  workflow_dispatch:
    inputs:
      preview_tag:
        description: Published preview release tag
        required: true
        type: string
      apk_sha256:
        description: SHA-256 of the preview release APK
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    outputs:
      apk-sha256: ${{ steps.apk.outputs.sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build and verify signed APK
        id: apk
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          HANGIL_KEYSTORE_PASSWORD: ${{ secrets.HANGIL_KEYSTORE_PASSWORD }}
          HANGIL_KEY_ALIAS: ${{ secrets.HANGIL_KEY_ALIAS }}
          HANGIL_KEY_PASSWORD: ${{ secrets.HANGIL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]]
          git merge-base --is-ancestor HEAD origin/main

          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 secret is required}"
          : "${HANGIL_KEYSTORE_PASSWORD:?HANGIL_KEYSTORE_PASSWORD secret is required}"
          : "${HANGIL_KEY_ALIAS:?HANGIL_KEY_ALIAS secret is required}"
          : "${HANGIL_KEY_PASSWORD:?HANGIL_KEY_PASSWORD secret is required}"
          umask 077
          signing_dir="$(mktemp -d)"
          trap 'rm -rf "$signing_dir"' EXIT
          export HANGIL_KEYSTORE_PATH="$signing_dir/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HANGIL_KEYSTORE_PATH"
          test -s "$HANGIL_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64

          version="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon --console=plain "-PreleaseVersion=$version" "-PreleaseVersionCode=$GITHUB_RUN_NUMBER" :app:assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          "$sdk_dir/build-tools/35.0.0/apksigner" verify "$apk"
          mkdir -p dist
          cp "$apk" "dist/hangil-$version.apk"
          (cd dist && sha256sum "hangil-$version.apk" > SHA256SUMS.txt)
          awk '{print "sha256=" $1}' dist/SHA256SUMS.txt >> "$GITHUB_OUTPUT"
      - name: Publish APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS.txt --verify-tag --generate-notes

  publish-package:
    needs: publish
    if: >-
      !cancelled() &&
      ((github.event_name == 'push' && needs.publish.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: '1.3.6'
      - name: Publish and verify APK in GitHub Packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SHA256: ${{ needs.publish.outputs.apk-sha256 || inputs.apk_sha256 }}
          RELEASE_TAG: ${{ inputs.preview_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$APK_SHA256" =~ ^[a-f0-9]{64}$ ]]
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[1-9][0-9]*$ ]]
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
              --jq '.isPrerelease and (.isDraft | not)' | grep -qx true
            revision="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
            [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
            gh api "repos/$GITHUB_REPOSITORY/compare/$revision...main" --jq .status \
              | grep -Eq '^(identical|ahead)$'
          else
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            revision="$GITHUB_SHA"
          fi
          umask 077
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          config="$temp_dir/registry.json"
          apk="hangil-${RELEASE_TAG#v}.apk"
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          package="ghcr.io/$repository-apk"
          ref="$package:$RELEASE_TAG"

          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$temp_dir/release" --pattern "$apk" --pattern SHA256SUMS.txt
          cd "$temp_dir/release"
          printf '%s  %s\n' "$APK_SHA256" "$apk" | cmp - SHA256SUMS.txt
          sha256sum --check --strict SHA256SUMS.txt

          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" \
            --password-stdin --registry-config "$config"
          unset GH_TOKEN
          oras push --registry-config "$config" \
            --artifact-type application/vnd.hangillab.android.release.v1 \
            --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.revision=$revision" \
            --annotation "org.opencontainers.image.version=${RELEASE_TAG#v}" \
            "$ref" "$apk:application/vnd.android.package-archive" SHA256SUMS.txt:text/plain

          digest="$(oras resolve --registry-config "$config" "$ref")"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo 'Invalid OCI manifest digest.'
            exit 1
          fi
          oras pull --registry-config "$config" --output "$temp_dir/pulled" "$package@$digest"
          cmp "$apk" "$temp_dir/pulled/$apk"
          cmp SHA256SUMS.txt "$temp_dir/pulled/SHA256SUMS.txt"
          printf 'GitHub Packages: `%s@%s`\n' "$package" "$digest" >> "$GITHUB_STEP_SUMMARY"
